<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Power Hour v3</title>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #f59e0b; --text: #f8fafc; --danger: #ef4444; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: var(--card); padding: 2rem; border-radius: 1rem; text-align: center; width: 100%; max-width: 650px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .config-group { margin-bottom: 1.2rem; text-align: left; }
        label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: #94a3b8; font-weight: 600; }
        input[type="number"], input[type="text"] { width: 100%; background: #0f172a; border: 1px solid #475569; color: white; padding: 10px; border-radius: 4px; box-sizing: border-box; }
        
        /* Volume Slider Styling */
        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--accent); }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 1rem; }
        button { background: var(--accent); color: #000; border: none; padding: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button.secondary { background: #475569; color: white; }
        button.danger { background: var(--danger); color: white; }
        
        #timer-display { font-size: 6rem; font-weight: bold; font-family: monospace; color: var(--accent); margin: 5px 0; text-shadow: 0 0 20px rgba(245, 158, 11, 0.3); }
        .hidden { display: none; }
        #player { margin-top: 1.5rem; border-radius: 8px; width: 100%; height: 200px; background: #000; overflow: hidden; }
        .volume-readout { font-size: 0.75rem; color: #94a3b8; float: right; }
    </style>
</head>
<body>

<div class="container">
    <div id="setup">
        <h1>🍻 Power Hour</h1>
        <div class="config-group">
            <label>Minutes (Rounds):</label>
            <input type="number" id="roundsInput" value="60">
        </div>
        <div class="config-group">
            <label>YouTube Playlist ID:</label>
            <input type="text" id="playlistInput" value="PLMC9KNkIncKtPojQ-nuy8rIELdbfSktas">
        </div>
        <div class="config-group">
            <label>SFX Volume (The Pour): <span class="volume-readout" id="sfxVal">100%</span></label>
            <input type="range" id="sfxVolInput" min="0" max="1" step="0.05" value="1" oninput="updateVolLabels()">
        </div>
        <button onclick="initGame()" style="width: 100%; margin-top: 10px; font-size: 1.1rem;">START THE PARTY</button>
    </div>

    <div id="game-ui" class="hidden">
        <div id="round-info" style="font-size: 1.2rem; letter-spacing: 1px;">ROUND 1 / 60</div>
        <div id="timer-display">01:00</div>
        
        <div class="btn-grid">
            <button id="pauseBtn" onclick="togglePause()">PAUSE</button>
            <button class="secondary" onclick="skipSong()">SKIP SONG</button>
        </div>
        
        <div class="config-group" style="margin-top: 1.5rem;">
            <label>Master Music Volume: <span class="volume-readout" id="musVal">80%</span></label>
            <input type="range" id="musVolInput" min="0" max="100" step="1" value="80" oninput="updateLiveMusicVol()">
        </div>

        <button class="danger" onclick="forceNextRound()" style="width: 100%;">DRINK NOW (RESET CLOCK)</button>

        <div id="player"></div>
    </div>
</div>

<script>
    let player, timer, secondsLeft = 60, currentRound = 1, totalRounds = 60;
    let isPaused = false;
    let userMusicVol = 80;
    
    // Using your uploaded "cracking open and pouring" sound
    const drinkSound = new Audio('http://googleusercontent.com/file_content/0'); 

    function updateVolLabels() {
        document.getElementById('sfxVal').innerText = Math.round(document.getElementById('sfxVolInput').value * 100) + "%";
    }

    function updateLiveMusicVol() {
        userMusicVol = document.getElementById('musVolInput').value;
        document.getElementById('musVal').innerText = userMusicVol + "%";
        if (player && !isPaused) {
            player.setVolume(userMusicVol);
        }
    }

    function initGame() {
        totalRounds = document.getElementById('roundsInput').value;
        const playlistId = document.getElementById('playlistInput').value;
        
        // Set SFX volume based on setup slider
        drinkSound.volume = document.getElementById('sfxVolInput').value;
        
        document.getElementById('setup').classList.add('hidden');
        document.getElementById('game-ui').classList.remove('hidden');

        player = new YT.Player('player', {
            height: '200', width: '100%',
            playerVars: { 'listType': 'playlist', 'list': playlistId, 'autoplay': 1, 'controls': 1 },
            events: { 
                'onReady': (event) => {
                    event.target.setVolume(userMusicVol);
                    event.target.playVideo();
                    startTimer();
                } 
            }
        });
    }

    function startTimer() {
        if (timer) clearInterval(timer);
        timer = setInterval(() => {
            if (!isPaused) {
                secondsLeft--;
                updateDisplay();
                if (secondsLeft <= 0) handleNewRound();
            }
        }, 1000);
    }

    function updateDisplay() {
        const mins = Math.floor(secondsLeft / 60);
        const secs = secondsLeft % 60;
        document.getElementById('timer-display').innerText = 
            `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        document.getElementById('round-info').innerText = `ROUND ${currentRound} / ${totalRounds}`;
    }

    function togglePause() {
        isPaused = !isPaused;
        const btn = document.getElementById('pauseBtn');
        if (isPaused) {
            player.pauseVideo();
            btn.innerText = "RESUME";
            btn.style.background = "#22c55e";
        } else {
            player.playVideo();
            btn.innerText = "PAUSE";
            btn.style.background = "var(--accent)";
            player.setVolume(userMusicVol);
        }
    }

    function skipSong() {
        player.nextVideo();
        secondsLeft = 60;
        updateDisplay();
    }

    function forceNextRound() {
        handleNewRound();
    }

    function handleNewRound() {
        if (currentRound >= totalRounds) {
            clearInterval(timer);
            document.getElementById('timer-display').innerText = "FINISH!";
            player.stopVideo();
            return;
        }

        // 1. Duck music volume to 15% of its CURRENT setting
        player.setVolume(userMusicVol * 0.2);
        
        // 2. Play your custom cracking/pour sound at its preset level
        drinkSound.play();

        player.nextVideo();
        currentRound++;
        secondsLeft = 60;
        updateDisplay();

        // 3. Restore music volume after sound finishes
        setTimeout(() => {
            if(!isPaused) player.setVolume(userMusicVol);
        }, 4000); 
    }
</script>
</body>
</html>
