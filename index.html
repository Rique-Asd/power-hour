<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Power Hour</title>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #f59e0b;
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 800px;
            width: 100%;
        }

        h1 { color: var(--accent); margin-bottom: 0.5rem; }

        .config-panel {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            padding: 1rem;
            border-bottom: 1px solid #334155;
        }

        input {
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            padding: 8px;
            border-radius: 4px;
        }

        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.95); }

        #timer-display {
            font-size: 5rem;
            font-weight: bold;
            font-family: monospace;
            margin: 1rem 0;
            color: var(--accent);
        }

        #round-info {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        #player {
            margin-top: 1rem;
            border-radius: 8px;
            max-width: 100%;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🍻 Power Hour</h1>
    
    <div class="config-panel" id="setup">
        <div>
            <label>Minutes:</label>
            <input type="number" id="roundsInput" value="60" min="1">
        </div>
        <div>
            <label>Playlist ID:</label>
            <input type="text" id="playlistInput" placeholder="Enter Playlist ID" value="PLMC9KNkIncKtPojQ-nuy8rIELdbfSktas">
        </div>
        <button onclick="initGame()">START GAME</button>
    </div>

    <div id="game-ui" class="hidden">
        <div id="round-info">Round 1 / 60</div>
        <div id="timer-display">01:00</div>
        <div id="player"></div>
    </div>
</div>

<script>
    let player;
    let timer;
    let secondsLeft = 60;
    let currentRound = 1;
    let totalRounds = 60;
    
    // Using a reliable CDN for the beer sound
    const sfx = new Audio('https://assets.mixkit.co/active_storage/sfx/2005/2005-preview.mp3');

    // Initialize YouTube API
    function onYouTubeIframeAPIReady() {
        // API is ready, but we wait for user to click start to avoid autoplay blocks
    }

    function initGame() {
        totalRounds = document.getElementById('roundsInput').value;
        const playlistId = document.getElementById('playlistInput').value;
        
        document.getElementById('setup').classList.add('hidden');
        document.getElementById('game-ui').classList.remove('hidden');
        document.getElementById('round-info').innerText = `Round ${currentRound} / ${totalRounds}`;

        player = new YT.Player('player', {
            height: '360',
            width: '100%',
            playerVars: {
                'listType': 'playlist',
                'list': playlistId,
                'autoplay': 1,
                'controls': 1
            },
            events: {
                'onReady': startSequence
            }
        });
    }

    function startSequence() {
        player.playVideo();
        startTimer();
    }

    function startTimer() {
        timer = setInterval(() => {
            secondsLeft--;
            
            // Update Visuals
            const mins = Math.floor(secondsLeft / 60);
            const secs = secondsLeft % 60;
            document.getElementById('timer-display').innerText = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

            if (secondsLeft <= 0) {
                handleNewRound();
            }
        }, 1000);
    }

    function handleNewRound() {
        if (currentRound >= totalRounds) {
            clearInterval(timer);
            document.getElementById('timer-display').innerText = "DONE!";
            player.stopVideo();
            return;
        }

        // 1. Duck the music
        player.setVolume(15);
        
        // 2. Play the sound
        sfx.play();

        // 3. Skip to next song
        player.nextVideo();

        // 4. Update round info
        currentRound++;
        document.getElementById('round-info').innerText = `Round ${currentRound} / ${totalRounds}`;

        // 5. Reset timer
        secondsLeft = 60;

        // 6. Restore volume after sound effect ends (approx 3 seconds)
        setTimeout(() => {
            player.setVolume(100);
        }, 3000);
    }
</script>

</body>
</html>
