<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Hour Dashboard</title>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        :root { --bg: #020617; --panel: #1e293b; --accent: #f59e0b; --text: #f8fafc; --danger: #ef4444; --success: #22c55e; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

        /* Screens */
        #setup, #game-over { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .setup-card { background: var(--panel); padding: 3rem; border-radius: 1.5rem; width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid #334155; }

        /* Dashboard Layout */
        #game-ui { display: flex; height: 100vh; width: 100vw; }
        .sidebar { width: 380px; background: var(--panel); display: flex; flex-direction: column; padding: 25px; border-right: 1px solid #334155; box-shadow: 10px 0 30px rgba(0,0,0,0.5); z-index: 10; box-sizing: border-box; }
        
        /* Dual Player Container */
        .video-container { flex-grow: 1; background: #000; position: relative; }
        .yt-player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; transition: opacity 0.2s; }
        .player-active { opacity: 1; z-index: 2; }
        .player-hidden { opacity: 0; z-index: 1; }

        /* HUD */
        #timer-display { font-size: 6rem; font-weight: 900; font-family: monospace; color: var(--accent); text-align: center; line-height: 1; margin: 10px 0; }
        #round-info { font-size: 1.2rem; text-align: center; color: #94a3b8; text-transform: uppercase; letter-spacing: 2px; }

        /* Controls */
        .vol-row { margin-bottom: 1.2rem; text-align: left; }
        label { display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 8px; font-weight: bold; text-transform: uppercase; }
        input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
        input[type="text"], input[type="number"] { width: 100%; background: #0f172a; border: 1px solid #475569; color: white; padding: 12px; border-radius: 6px; box-sizing: border-box; margin-bottom: 1rem; }
        .vol-val { float: right; color: var(--accent); }

        .btn-stack { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        button { border: 1px solid rgba(255,255,255,0.1); padding: 14px; font-weight: 800; border-radius: 8px; cursor: pointer; text-transform: uppercase; transition: 0.2s; font-size: 0.9rem; }
        
        .btn-main { background: var(--accent); color: #000; }
        .btn-sec { background: #475569; color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-manual { background: #6366f1; color: white; } 
        
        .hidden { display: none !important; }
        
        h1 { margin-bottom: 0.5rem; }
        .thank-you-msg { font-size: 2.5rem; font-weight: 900; color: var(--accent); margin-bottom: 2rem; }
    </style>
</head>
<body>

<div id="setup">
    <div class="setup-card">
        <h1>POWER HOUR</h1>
        <div style="text-align: left;">
            <label>Minutes to Play:</label>
            <input type="number" id="roundsInput" value="60">
            <label>YouTube Playlist ID:</label>
            <input type="text" id="playlistInput" value="PLO-9GUc2ykdMGwtfjy9HZKKNR8GNMR37_"> 
        </div>
        <button class="btn-main" onclick="initGame()" style="width: 100%;">START THE PARTY</button>
    </div>
</div>

<div id="game-ui" class="hidden">
    <div class="sidebar">
        <div id="round-info">ROUND 1 / 60</div>
        <div id="timer-display">01:00</div>

        <div class="vol-row">
            <label>Music Volume <span class="vol-val" id="musLabel">80%</span></label>
            <input type="range" id="musVolInput" min="0" max="100" value="80" oninput="updateAllVolumes()">
        </div>

        <div class="vol-row">
            <label>SFX Volume <span class="vol-val" id="sfxLabel">100%</span></label>
            <input type="range" id="sfxVolInput" min="0" max="1" step="0.05" value="1" oninput="updateAllVolumes()">
        </div>

        <div class="btn-stack">
            <button id="pauseBtn" class="btn-sec" onclick="togglePause()">PAUSE GAME</button>
            <button class="btn-sec" onclick="resetTimerOnly()">RESET TIMER</button>
            <button class="btn-manual" onclick="playManualSFX()">PLAY DRINK SFX</button>
            <button class="btn-danger" onclick="skipSong()">SKIP SONG</button>
        </div>
    </div>
    <div class="video-container">
        <!-- Two players for background buffering -->
        <div id="playerA" class="yt-player player-active"></div>
        <div id="playerB" class="yt-player player-hidden"></div>
    </div>
</div>

<div id="game-over" class="hidden">
    <div class="setup-card">
        <div class="thank-you-msg">THANK YOU FOR PLAYING</div>
        <button class="btn-main" onclick="location.reload()" style="width: 100%;">PLAY AGAIN</button>
    </div>
</div>

<script>
let playerA, playerB;
let activePlayerStr = 'A'; 
let videoIds = [];
let currentVideoIdx = 0;
let playlistLoaded = false;

let timer = null;
let secondsLeft = 60;
let currentRound = 1;
let totalRounds = 60;
let isPaused = false;
let musicVol = 80;
let sfxVol = 1.0;

const drinkSound = new Audio('drink.mp3'); 
drinkSound.preload = "auto";

function initGame() {
    totalRounds = Number(document.getElementById('roundsInput').value) || 60;
    const playlistId = document.getElementById('playlistInput').value.trim();

    document.getElementById('setup').classList.add('hidden');
    document.getElementById('game-ui').classList.remove('hidden');

    updateDisplay();

    // Initialize both players
    if (window.YT && YT.Player) {
        // Player A loads the playlist first so we can extract the video IDs
        playerA = new YT.Player('playerA', {
            playerVars: { listType: 'playlist', list: playlistId, autoplay: 1, controls: 0, origin: window.location.origin },
            events: {
                'onReady': (e) => { e.target.setVolume(musicVol); e.target.playVideo(); },
                'onStateChange': (e) => onPlayerStateChange(e, 'A')
            }
        });

        playerB = new YT.Player('playerB', {
            playerVars: { controls: 0, origin: window.location.origin },
            events: {
                'onReady': (e) => { e.target.mute(); }, // Start B muted
                'onStateChange': (e) => onPlayerStateChange(e, 'B')
            }
        });
    }
}

function onPlayerStateChange(event, playerId) {
    // If a video starts playing...
    if (event.data === YT.PlayerState.PLAYING) {
        
        // 1. If it's the very first time the playlist loads, extract the IDs.
        if (!playlistLoaded && playerId === 'A') {
            playlistLoaded = true;
            videoIds = playerA.getPlaylist(); // Extract all IDs from playlist
            currentVideoIdx = playerA.getPlaylistIndex();
            startCountdown();
            bufferNextSong(); // Tell Player B to get ready
        }

        // 2. If the BACKGROUND player starts playing, pause it immediately.
        // This forces the browser to buffer the chunk, but stops the video until we need it.
        let bgPlayerStr = (activePlayerStr === 'A') ? 'B' : 'A';
        if (playerId === bgPlayerStr) {
            let bgPlayer = (bgPlayerStr === 'A') ? playerA : playerB;
            bgPlayer.pauseVideo();
        }
    }
}

function bufferNextSong() {
    if (videoIds.length === 0) return;
    
    // Calculate the next song index (loops back to 0 if we hit the end of the playlist)
    let nextIdx = (currentVideoIdx + 1) % videoIds.length;
    let nextVideoId = videoIds[nextIdx];

    // Load it into the background player
    let bgPlayer = (activePlayerStr === 'A') ? playerB : playerA;
    bgPlayer.mute(); // Ensure it's muted
    bgPlayer.loadVideoById(nextVideoId); 
    // It will start playing, trigger 'onStateChange', and immediately pause itself.
}

function startCountdown() {
    if (timer) clearInterval(timer);
    secondsLeft = 60;
    
    timer = setInterval(() => {
        if (!isPaused) {
            secondsLeft--;
            if (secondsLeft <= 0) {
                nextRound();
            }
            updateDisplay();
        }
    }, 1000);
}

function updateDisplay() {
    const mins = Math.floor(secondsLeft / 60);
    const secs = secondsLeft % 60;
    document.getElementById('timer-display').innerText = 
        `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    document.getElementById('round-info').innerText = `ROUND ${currentRound} / ${totalRounds}`;
}

function nextRound() {
    if (currentRound >= totalRounds) {
        endGame();
        return;
    }
    
    playManualSFX();
    currentRound++;
    secondsLeft = 60;
    currentVideoIdx = (currentVideoIdx + 1) % videoIds.length;

    // Swap Players
    let prevPlayer = (activePlayerStr === 'A') ? playerA : playerB;
    activePlayerStr = (activePlayerStr === 'A') ? 'B' : 'A';
    let newPlayer = (activePlayerStr === 'A') ? playerA : playerB;

    // Update UI classes for fade transition
    document.getElementById('playerA').className = (activePlayerStr === 'A') ? 'yt-player player-active' : 'yt-player player-hidden';
    document.getElementById('playerB').className = (activePlayerStr === 'B') ? 'yt-player player-active' : 'yt-player player-hidden';

    // Stop old song, play new buffered song
    prevPlayer.stopVideo();
    
    newPlayer.unMute();
    newPlayer.setVolume(musicVol);
    newPlayer.playVideo();

    // Start buffering the next song in the now-hidden player
    bufferNextSong();
}

function endGame() {
    clearInterval(timer);
    secondsLeft = 0;
    updateDisplay();
    playManualSFX();

    setTimeout(() => {
        if (playerA && playerA.stopVideo) playerA.stopVideo();
        if (playerB && playerB.stopVideo) playerB.stopVideo();
        document.getElementById('game-ui').classList.add('hidden');
        document.getElementById('game-over').classList.remove('hidden');
    }, 5000);
}

function resetTimerOnly() {
    secondsLeft = 60;
    updateDisplay();
}

function playManualSFX() {
    let activePlayer = (activePlayerStr === 'A') ? playerA : playerB;
    if (activePlayer && activePlayer.setVolume) activePlayer.setVolume(musicVol * 0.2);
    
    drinkSound.volume = sfxVol;
    drinkSound.currentTime = 0;
    drinkSound.play().catch(e => console.warn("Audio file missing."));

    setTimeout(() => {
        const isGameOver = !document.getElementById('game-over').classList.contains('hidden');
        if (!isPaused && activePlayer && activePlayer.setVolume && !isGameOver) {
            activePlayer.setVolume(musicVol);
        }
    }, 2750);
}

function togglePause() {
    isPaused = !isPaused;
    const btn = document.getElementById('pauseBtn');
    let activePlayer = (activePlayerStr === 'A') ? playerA : playerB;
    
    if (isPaused) {
        if (activePlayer && activePlayer.pauseVideo) activePlayer.pauseVideo();
        btn.innerText = "RESUME GAME";
    } else {
        if (activePlayer && activePlayer.playVideo) activePlayer.playVideo();
        btn.innerText = "PAUSE GAME";
    }
}

function updateAllVolumes() {
    musicVol = Number(document.getElementById('musVolInput').value);
    document.getElementById('musLabel').innerText = musicVol + "%";
    sfxVol = Number(document.getElementById('sfxVolInput').value);
    document.getElementById('sfxLabel').innerText = Math.round(sfxVol * 100) + "%";
    
    let activePlayer = (activePlayerStr === 'A') ? playerA : playerB;
    if (activePlayer && activePlayer.setVolume) activePlayer.setVolume(musicVol);
}

function skipSong() {
    nextRound();
}
</script>
</body>
</html>
