<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Hour: Elite Dashboard</title>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        :root { --bg: #020617; --panel: #1e293b; --accent: #f59e0b; --text: #f8fafc; --danger: #ef4444; --success: #22c55e; }
        
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

        /* Setup Screen Style */
        #setup { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; background: radial-gradient(circle, #1e293b 0%, #020617 100%); }
        .setup-card { background: var(--panel); padding: 3rem; border-radius: 1.5rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); width: 420px; border: 1px solid #334155; }

        /* Game Layout */
        #game-ui { display: flex; height: 100vh; width: 100vw; }

        /* Left Sidebar (Controls) */
        .sidebar { width: 380px; background: var(--panel); display: flex; flex-direction: column; padding: 25px; box-shadow: 10px 0 30px rgba(0,0,0,0.5); z-index: 10; border-right: 1px solid #334155; }

        /* Right Side (Video) */
        .video-container { flex-grow: 1; background: #000; position: relative; display: flex; align-items: center; justify-content: center; }
        #player { width: 100%; height: 100%; }

        /* UI Elements */
        #timer-display { font-size: 7rem; font-weight: 900; font-family: 'Courier New', monospace; color: var(--accent); margin: 0; text-align: center; line-height: 1; text-shadow: 0 0 30px rgba(245, 158, 11, 0.4); }
        #round-info { font-size: 1.4rem; text-align: center; color: #94a3b8; text-transform: uppercase; letter-spacing: 3px; font-weight: bold; margin-bottom: 5px; }

        .control-group { margin-top: 2.5rem; }
        .vol-row { margin-bottom: 2rem; }
        label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        
        input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; height: 8px; border-radius: 5px; }
        input[type="text"], input[type="number"] { width: 100%; background: #0f172a; border: 1px solid #475569; color: white; padding: 12px; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }

        .btn-stack { display: flex; flex-direction: column; gap: 12px; margin-top: auto; }
        button { border: none; padding: 18px; font-weight: 800; border-radius: 8px; cursor: pointer; text-transform: uppercase; transition: all 0.2s ease; font-size: 0.9rem; letter-spacing: 1px; }
        button:hover { filter: brightness(1.1); transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        
        .btn-main { background: var(--accent); color: #000; }
        .btn-sec { background: #475569; color: white; }
        .btn-danger { background: var(--danger); color: white; }

        .hidden { display: none !important; }
        .vol-val { float: right; color: var(--accent); font-family: monospace; font-size: 1rem; }
    </style>
</head>
<body>

<div id="setup">
    <div class="setup-card">
        <h1 style="margin-top:0; letter-spacing: -1px;">🍻 POWER HOUR</h1>
        <p style="color: #94a3b8; margin-bottom: 2rem;">Configure your session</p>
        
        <div style="text-align: left; margin-bottom: 1.5rem;">
            <label>Rounds (Minutes):</label>
            <input type="number" id="roundsInput" value="60">
        </div>
        
        <div style="text-align: left; margin-bottom: 2rem;">
            <label>Playlist ID:</label>
            <input type="text" id="playlistInput" value="PLO-9GUc2ykdMGwtfjy9HZKKNR8GNMR37_">
        </div>
        
        <button class="btn-main" onclick="initGame()" style="width: 100%; font-size: 1.2rem;">START THE PARTY</button>
    </div>
</div>

<div id="game-ui" class="hidden">
    <div class="sidebar">
        <div id="round-info">ROUND 1 / 60</div>
        <div id="timer-display">01:00</div>

        <div class="control-group">
            <div class="vol-row">
                <label>Music Volume <span class="vol-val" id="musLabel">80%</span></label>
                <input type="range" id="musVolInput" min="0" max="100" value="80" oninput="updateMusicVol()">
            </div>
            
            <div class="vol-row">
                <label>Pour SFX Volume <span class="vol-val" id="sfxLabel">100%</span></label>
                <input type="range" id="sfxVolInput" min="0" max="1" step="0.05" value="1" oninput="updateSfxVol()">
            </div>
        </div>

        <div class="btn-stack">
            <button id="pauseBtn" class="btn-sec" onclick="togglePause()" style="background: var(--success); color: #000;">PAUSE GAME</button>
            <button class="btn-sec" onclick="skipSong()">SKIP SONG / RESET</button>
            <button class="btn-danger" onclick="forceNextRound()">FORCE DRINK NOW</button>
        </div>
    </div>

    <div class="video-container">
        <div id="player"></div>
    </div>
</div>

<script>
    let player, timer, secondsLeft = 60, currentRound = 1, totalRounds = 60;
    let isPaused = false;
    let masterMusicVol = 80;

    // POINTING TO YOUR REPOSITORY FILE
    const drinkSound = new Audio('drink.mp3'); 

    function updateMusicVol() {
        masterMusicVol = document.getElementById('musVolInput').value;
        document.getElementById('musLabel').innerText = masterMusicVol + "%";
        if (player && !isPaused) player.setVolume(masterMusicVol);
    }

    function updateSfxVol() {
        const val = document.getElementById('sfxVolInput').value;
        drinkSound.volume = val;
        document.getElementById('sfxLabel').innerText = Math.round(val * 100) + "%";
    }

    function initGame() {
        totalRounds = parseInt(document.getElementById('roundsInput').value);
        const playlistId = document.getElementById('playlistInput').value;
        
        // Pre-load the sound so there is no delay
        drinkSound.load(); 

        document.getElementById('setup').classList.add('hidden');
        document.getElementById('game-ui').classList.remove('hidden');

        player = new YT.Player('player', {
            playerVars: { 
                'listType': 'playlist', 
                'list': playlistId, 
                'autoplay': 1, 
                'controls': 1, 
                'modestbranding': 1,
                'rel': 0 
            },
            events: {
                'onReady': (e) => {
                    e.target.setVolume(masterMusicVol);
                    e.target.playVideo();
                    startTimer();
                }
            }
        });
    }

    // ... rest of your timer and round functions stay the same ...
</script>

</body>
</html>
